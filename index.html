<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tungtunghook.cc - HvH Community</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #060102;
            --bg-card: rgba(18, 4, 7, 0.75);
            --red-main: #800000;
            --red-neon: #ff003c;
            --red-glow: rgba(255, 0, 60, 0.7);
            --text-main: #ffffff;
            --text-sub: #a39295;
            --border-neon: rgba(255, 0, 60, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas z efektami w tle i za myszką */
        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        /* Ambient Glow & Animated Grids */
        .bg-scanner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, transparent, var(--red-neon), transparent);
            box-shadow: 0 0 15px var(--red-neon);
            opacity: 0.6;
            animation: scan 6s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255,0,60,0.12) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 0;
            animation: pulse 3s infinite alternate ease-in-out;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
        }

        /* Navbar */
        nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            border-bottom: 1px solid var(--border-neon);
            background: rgba(8, 2, 4, 0.85);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            text-shadow: 0 0 10px var(--red-glow), 0 0 20px var(--red-glow);
            transition: all 0.3s ease;
        }

        .logo:hover {
            text-shadow: 0 0 20px var(--red-neon), 0 0 40px var(--red-neon);
            transform: scale(1.03);
        }

        .discord-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #4a000c, var(--red-main));
            color: #fff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 700;
            border: 1px solid var(--red-neon);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .discord-btn:hover {
            box-shadow: 0 0 30px var(--red-neon);
            transform: translateY(-2px);
            background: linear-gradient(135deg, var(--red-main), var(--red-neon));
        }

        /* Container Main */
        .main-container {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            flex-grow: 1;
            width: 100%;
        }

        .hero {
            text-align: center;
            margin-bottom: 50px;
        }

        /* Glitch animation dla nagłówka */
        .glitch-title {
            font-size: 56px;
            font-weight: 900;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            color: #fff;
            text-shadow: 0 0 15px var(--red-glow);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .hero p {
            color: var(--text-sub);
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* Categories Navigation */
        .categories-main {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .cat-main-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            color: var(--text-sub);
            padding: 16px 45px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cat-main-btn:hover, .cat-main-btn.active {
            color: #fff;
            border-color: var(--red-neon);
            box-shadow: 0 0 25px var(--red-glow), inset 0 0 15px rgba(255, 0, 60, 0.2);
            background: linear-gradient(180deg, rgba(255,0,60,0.2), rgba(20,5,7,0.8));
            transform: scale(1.05);
        }

        .sub-categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 40px;
        }

        .sub-btn {
            background: rgba(20, 5, 7, 0.6);
            border: 1px solid rgba(255, 0, 60, 0.2);
            color: var(--text-sub);
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .sub-btn:hover, .sub-btn.active {
            color: #fff;
            border-color: var(--red-neon);
            background: var(--red-main);
            box-shadow: 0 0 18px var(--red-glow);
            transform: translateY(-2px);
        }

        /* Config Grid */
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 25px;
            perspective: 1000px;
        }

        .config-card {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: 14px;
            padding: 26px;
            position: relative;
            backdrop-filter: blur(10px);
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform-style: preserve-3d;
        }

        .config-card:hover {
            border-color: var(--red-neon);
            box-shadow: 0 10px 35px rgba(255, 0, 60, 0.4), inset 0 0 15px rgba(255, 0, 60, 0.1);
        }

        .config-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .config-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .config-link-btn {
            display: block;
            text-align: center;
            background: rgba(128, 0, 0, 0.3);
            border: 1px solid var(--red-neon);
            color: #fff;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255,0,60,0.2);
        }

        .config-link-btn:hover {
            background: var(--red-neon);
            box-shadow: 0 0 20px var(--red-neon);
            color: #fff;
        }

        /* Coming Soon Box */
        .coming-soon-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 20px;
            background: var(--bg-card);
            border: 1px dashed var(--red-neon);
            border-radius: 14px;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 30px rgba(255, 0, 60, 0.15);
            animation: pulse-border 2s infinite alternate;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(255, 0, 60, 0.3); }
            100% { border-color: rgba(255, 0, 60, 0.9); }
        }

        .coming-soon-box i {
            font-size: 52px;
            color: var(--red-neon);
            margin-bottom: 15px;
            text-shadow: 0 0 20px var(--red-glow);
            animation: rotate-icon 4s infinite linear;
        }

        @keyframes rotate-icon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
            100% { transform: rotate(360deg); }
        }

        .coming-soon-box h2 {
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Ripple Effect CS */
        .ripple {
            position: absolute;
            background: rgba(255, 0, 60, 0.6);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.5s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--border-neon);
            background: rgba(6, 1, 2, 0.95);
            margin-top: auto;
        }

        footer p {
            color: var(--text-sub);
            font-size: 14px;
        }

        footer span.author {
            color: var(--red-neon);
            font-weight: 800;
            text-shadow: 0 0 10px var(--red-glow);
        }

        .hvh-tag {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            letter-spacing: 3px;
            color: #777;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>
    <div class="bg-scanner"></div>
    <div class="ambient-glow"></div>

    <nav>
        <div class="logo">Tungtunghook.cc</div>
        <a href="https://discord.gg/zvyE4xyS8h" target="_blank" class="discord-btn ripple-btn">
            <i class="fa-brands fa-discord"></i> Dołącz do Discorda
        </a>
    </nav>

    <div class="main-container">
        <div class="hero">
            <h1 class="glitch-title">Tungtunghook.cc</h1>
            <p>Dominacja Społeczności HvH &bull; Konfiguracje i Skrypty</p>
        </div>

        <div class="categories-main">
            <button class="cat-main-btn active ripple-btn" onclick="selectMainCategory('cs2')">
                <i class="fa-solid fa-crosshairs"></i> CS2
            </button>
            <button class="cat-main-btn ripple-btn" onclick="selectMainCategory('minecraft')">
                <i class="fa-solid fa-cube"></i> Minecraft
            </button>
        </div>

        <div class="sub-categories" id="cs2-subs">
            <button class="sub-btn active ripple-btn" onclick="selectSubCategory('neverlose')">Neverlose.cc</button>
            <button class="sub-btn ripple-btn" onclick="selectSubCategory('fatality')">Fatality.win</button>
            <button class="sub-btn ripple-btn" onclick="selectSubCategory('nixware')">nixware.cc</button>
            <button class="sub-btn ripple-btn" onclick="selectSubCategory('gamesense')">gamesense.pub</button>
        </div>

        <div class="sub-categories" id="mc-subs" style="display: none;">
            <button class="sub-btn ripple-btn" onclick="selectSubCategory('catlean')">CatLean.su</button>
            <button class="sub-btn ripple-btn" onclick="selectSubCategory('rasiware')">RasiWare [Beta]</button>
        </div>

        <div class="config-grid" id="config-container"></div>
    </div>

    <footer>
        <p>Strona stworzona przez <span class="author">Sch1zVs</span></p>
        <div class="hvh-tag">Dominacja Społeczności HvH &bull; All rights reserved</div>
    </footer>

    <script>
        // Baza danych konfiguracji
        const configData = {
            neverlose: [
                { name: "Scout & Auto God CFG", desc: "Zdominuj serwer HvH z perfekcyjnym hitchance i doubletapem.", link: "https://neverlose.cc/" },
                { name: "Rage AWP/Scout Peak", desc: "Ustawienia stworzone z myślą o agresywnym peekowaniu.", link: "https://neverlose.cc/" },
                { name: "Semi-Rage Prime", desc: "Idealny balans między ukrywaniem się a potężnym rage.", link: "https://neverlose.cc/" },
                { name: "Public HvH Dominator", desc: "Darmowy, publiczny zestaw visualsów i rage pod serwery FFA.", link: "https://neverlose.cc/" },
                { name: "Private Playstyle Config", desc: "Najwyższa skuteczność przeciwko topowym cheatom.", link: "https://neverlose.cc/" }
            ]
        };

        let currentMain = 'cs2';
        let currentSub = 'neverlose';

        function selectMainCategory(main) {
            currentMain = main;
            document.querySelectorAll('.cat-main-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (main === 'cs2') {
                document.getElementById('cs2-subs').style.display = 'flex';
                document.getElementById('mc-subs').style.display = 'none';
                setActiveSub(document.getElementById('cs2-subs').children[0]);
                selectSubCategory('neverlose');
            } else {
                document.getElementById('cs2-subs').style.display = 'none';
                document.getElementById('mc-subs').style.display = 'flex';
                setActiveSub(document.getElementById('mc-subs').children[0]);
                selectSubCategory('catlean');
            }
        }

        function selectSubCategory(sub) {
            currentSub = sub;
            renderConfigs();
        }

        function setActiveSub(element) {
            const parent = element.parentElement;
            parent.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        document.querySelectorAll('.sub-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                setActiveSub(this);
            });
        });

        function renderConfigs() {
            const container = document.getElementById('config-container');
            container.innerHTML = '';

            if (currentSub === 'neverlose') {
                configData.neverlose.forEach(cfg => {
                    const card = document.createElement('div');
                    card.className = 'config-card';
                    card.innerHTML = `
                        <div>
                            <div class="config-title">${cfg.name}</div>
                            <div class="config-desc">${cfg.desc}</div>
                        </div>
                        <a href="${cfg.link}" target="_blank" class="config-link-btn ripple-btn">Pobierz Link / Importuj</a>
                    `;
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = `
                    <div class="coming-soon-box">
                        <i class="fa-solid fa-hourglass-half"></i>
                        <h2>Wkrótce</h2>
                        <p style="color: var(--text-sub); margin-top: 10px;">Konfiguracje dla tej kategorii są w trakcie przygotowywania przez społeczność.</p>
                    </div>
                `;
            }

            applyRippleEvents();
            applyCardTilt();
        }

        /* --- ANIMACJA RIPPLE --- */
        function applyRippleEvents() {
            document.querySelectorAll('.ripple-btn').forEach(button => {
                button.onmousedown = function(e) {
                    let x = e.clientX - e.currentTarget.getBoundingClientRect().left;
                    let y = e.clientY - e.currentTarget.getBoundingClientRect().top;
                    
                    let ripples = document.createElement('span');
                    ripples.className = 'ripple';
                    ripples.style.left = x + 'px';
                    ripples.style.top = y + 'px';
                    
                    this.appendChild(ripples);
                    
                    setTimeout(() => {
                        ripples.remove();
                    }, 500);
                };
            });
        }

        /* --- EFEKT TILT (3D) DLA KART --- */
        function applyCardTilt() {
            const cards = document.querySelectorAll('.config-card');
            cards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = (y - centerY) / 10;
                    const rotateY = (centerX - x) / 10;

                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-5px)`;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
                });
            });
        }

        /* --- EFECT CANVAS: Cząsteczki w tle & Czerwona animacja za myszką --- */
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const mouse = { x: -100, y: -100 };
        const trailParticles = [];
        const bgParticles = [];

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            // Dodawanie cząsteczek za kursorom
            for (let i = 0; i < 3; i++) {
                trailParticles.push({
                    x: mouse.x,
                    y: mouse.y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2 - 1,
                    size: Math.random() * 4 + 2,
                    alpha: 1,
                    color: Math.random() > 0.3 ? '#ff003c' : '#800000'
                });
            }
        });

        // Tworzenie cząsteczek w tle
        for (let i = 0; i < 40; i++) {
            bgParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vy: -Math.random() * 0.8 - 0.2,
                size: Math.random() * 2 + 1,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function animateFX() {
            ctx.clearRect(0, 0, width, height);

            // Render cząsteczek tła
            ctx.fillStyle = '#ff003c';
            bgParticles.forEach(p => {
                p.y += p.vy;
                if (p.y < 0) p.y = height;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Render ogona za myszą (Cursor Trail)
            for (let i = 0; i < trailParticles.length; i++) {
                let p = trailParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.025;
                p.size *= 0.96;

                if (p.alpha <= 0 || p.size <= 0.3) {
                    trailParticles.splice(i, 1);
                    i--;
                    continue;
                }

                ctx.globalAlpha = p.alpha;
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(animateFX);
        }

        animateFX();
        renderConfigs();
    </script>
</body>
</html>
