<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tungtunghook.cc - HvH Community</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0203;
            --bg-card: #140507;
            --red-main: #800000;
            --red-neon: #ff003c;
            --red-glow: rgba(255, 0, 60, 0.6);
            --text-main: #ffffff;
            --text-sub: #a39295;
            --border-neon: #3a0d14;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(255, 0, 60, 0.15), transparent 60%),
                radial-gradient(circle at 50% 120%, rgba(128, 0, 0, 0.2), transparent 70%);
        }

        /* Ambient Animated Neon Glow */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,0,60,0.08) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 0;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* Navbar */
        nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            border-bottom: 1px solid var(--border-neon);
            background: rgba(10, 2, 3, 0.8);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--red-glow), 0 0 20px var(--red-glow);
            transition: all 0.3s ease;
        }

        .logo:hover {
            text-shadow: 0 0 15px var(--red-neon), 0 0 30px var(--red-neon);
            transform: scale(1.02);
        }

        .discord-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #40000a, var(--red-main));
            color: #fff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid var(--red-neon);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .discord-btn:hover {
            box-shadow: 0 0 25px var(--red-neon);
            transform: translateY(-2px);
            background: linear-gradient(135deg, var(--red-main), var(--red-neon));
        }

        /* Container Main */
        .main-container {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            flex-grow: 1;
            width: 100%;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--red-glow);
        }

        .hero p {
            color: var(--text-sub);
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Categories Navigation */
        .categories-main {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .cat-main-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            color: var(--text-sub);
            padding: 14px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cat-main-btn:hover, .cat-main-btn.active {
            color: #fff;
            border-color: var(--red-neon);
            box-shadow: 0 0 20px var(--red-glow);
            background: linear-gradient(180deg, rgba(255,0,60,0.1), transparent);
        }

        .sub-categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 40px;
        }

        .sub-btn {
            background: rgba(20, 5, 7, 0.6);
            border: 1px solid rgba(255, 0, 60, 0.2);
            color: var(--text-sub);
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sub-btn:hover, .sub-btn.active {
            color: #fff;
            border-color: var(--red-neon);
            background: var(--red-main);
            box-shadow: 0 0 15px var(--red-glow);
        }

        /* Config Grid */
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .config-card {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .config-card:hover {
            transform: translateY(-8px);
            border-color: var(--red-neon);
            box-shadow: 0 10px 30px rgba(255, 0, 60, 0.3);
        }

        .config-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .config-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .config-link-btn {
            display: block;
            text-align: center;
            background: transparent;
            border: 1px solid var(--red-neon);
            color: #fff;
            text-decoration: none;
            padding: 10px 0;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .config-link-btn:hover {
            background: var(--red-neon);
            box-shadow: 0 0 15px var(--red-neon);
            color: #fff;
        }

        /* Placeholder Content (Coming Soon) */
        .coming-soon-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            background: var(--bg-card);
            border: 1px dashed var(--red-neon);
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(255, 0, 60, 0.1);
        }

        .coming-soon-box i {
            font-size: 48px;
            color: var(--red-neon);
            margin-bottom: 15px;
            text-shadow: 0 0 15px var(--red-glow);
        }

        .coming-soon-box h2 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Ripple Effect CS */
        .ripple {
            position: absolute;
            background: rgba(255, 0, 60, 0.5);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 25px;
            border-top: 1px solid var(--border-neon);
            background: rgba(10, 2, 3, 0.9);
            margin-top: auto;
        }

        footer p {
            color: var(--text-sub);
            font-size: 14px;
        }

        footer span.author {
            color: var(--red-neon);
            font-weight: 700;
            text-shadow: 0 0 8px var(--red-glow);
        }

        .hvh-tag {
            display: inline-block;
            margin-top: 5px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <nav>
        <div class="logo">Tungtunghook.cc</div>
        <a href="https://discord.gg/zvyE4xyS8h" target="_blank" class="discord-btn ripple-btn">
            <i class="fa-brands fa-discord"></i> Dołącz do Discorda
        </a>
    </nav>

    <div class="main-container">
        <div class="hero">
            <h1>Tungtunghook.cc</h1>
            <p>Najlepsza społeczność HvH – Dedykowane Konfiguracje</p>
        </div>

        <div class="categories-main">
            <button class="cat-main-btn active ripple-btn" onclick="selectMainCategory('cs2')">
                <i class="fa-solid fa-crosshairs"></i> CS2
            </button>
            <button class="cat-main-btn ripple-btn" onclick="selectMainCategory('minecraft')">
                <i class="fa-solid fa-cube"></i> Minecraft
            </button>
        </div>

        <div class="sub-categories" id="cs2-subs">
            <button class="sub-btn active ripple-btn" onclick="selectSubCategory('neverlose')">Neverlose.cc</button>
            <button class="sub-btn ripple-btn" onclick="selectSubCategory('fatality')">Fatality.win</button>
            <button class="sub-btn ripple-btn" onclick="selectSubCategory('nixware')">nixware.cc</button>
            <button class="sub-btn ripple-btn" onclick="selectSubCategory('gamesense')">gamesense.pub</button>
        </div>

        <div class="sub-categories" id="mc-subs" style="display: none;">
            <button class="sub-btn ripple-btn" onclick="selectSubCategory('catlean')">CatLean.su</button>
            <button class="sub-btn ripple-btn" onclick="selectSubCategory('rasiware')">RasiWare [Beta]</button>
        </div>

        <div class="config-grid" id="config-container">
            </div>
    </div>

    <footer>
        <p>Strona stworzona przez <span class="author">Sch1zVs</span></p>
        <div class="hvh-tag">Dominacja Społeczności HvH &bull; All rights reserved</div>
    </footer>

    <script>
        // Baza danych konfiguracji
        const configData = {
            neverlose: [
                { name: "Scout & Auto God CFG", desc: "Zdominuj serwer HvH z perfekcyjnym hitchance i doubletapem.", link: "https://neverlose.cc/" },
                { name: "Rage AWP/Scout Peak", desc: "Ustawienia stworzone z myślą o agresywnym peekowaniu.", link: "https://neverlose.cc/" },
                { name: "Semi-Rage Prime", desc: "Idealny balans między ukrywaniem się a potężnym rage.", link: "https://neverlose.cc/" },
                { name: "Public HvH Dominator", desc: "Darmowy, publiczny zestaw visualsów i rage pod serwery FFA.", link: "https://neverlose.cc/" },
                { name: "Private Playstyle Config", desc: "Najwyższa skuteczność przeciwko topowym cheatom.", link: "https://neverlose.cc/" }
            ]
        };

        let currentMain = 'cs2';
        let currentSub = 'neverlose';

        function selectMainCategory(main) {
            currentMain = main;
            
            // Toggle active state dla głównych przycisków
            document.querySelectorAll('.cat-main-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (main === 'cs2') {
                document.getElementById('cs2-subs').style.display = 'flex';
                document.getElementById('mc-subs').style.display = 'none';
                // Reset podkategorii
                setActiveSub(document.getElementById('cs2-subs').children[0]);
                selectSubCategory('neverlose');
            } else {
                document.getElementById('cs2-subs').style.display = 'none';
                document.getElementById('mc-subs').style.display = 'flex';
                // Reset podkategorii
                setActiveSub(document.getElementById('mc-subs').children[0]);
                selectSubCategory('catlean');
            }
        }

        function selectSubCategory(sub) {
            currentSub = sub;
            renderConfigs();
        }

        function setActiveSub(element) {
            const parent = element.parentElement;
            parent.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        // Dodanie listenera dla podkategorii do podświetlania
        document.querySelectorAll('.sub-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                setActiveSub(this);
            });
        });

        function renderConfigs() {
            const container = document.getElementById('config-container');
            container.innerHTML = '';

            if (currentSub === 'neverlose') {
                configData.neverlose.forEach(cfg => {
                    const card = document.createElement('div');
                    card.className = 'config-card';
                    card.innerHTML = `
                        <div>
                            <div class="config-title">${cfg.name}</div>
                            <div class="config-desc">${cfg.desc}</div>
                        </div>
                        <a href="${cfg.link}" target="_blank" class="config-link-btn ripple-btn">Pobierz Link / Importuj</a>
                    `;
                    container.appendChild(card);
                });
            } else {
                // Dla pozostałych podkategorii wyswietla "Wkrótce"
                container.innerHTML = `
                    <div class="coming-soon-box">
                        <i class="fa-solid fa-hourglass-half"></i>
                        <h2>Wkrótce</h2>
                        <p style="color: var(--text-sub); margin-top: 10px;">Konfiguracje dla tej kategorii są w trakcie przygotowywania przez społeczność.</p>
                    </div>
                `;
            }

            // Re-apply ripple do nowo powstałych elementów
            applyRippleEvents();
        }

        // Animacja kliknięcia (Ripple Effect)
        function applyRippleEvents() {
            document.querySelectorAll('.ripple-btn, .config-card').forEach(button => {
                button.onmousedown = function(e) {
                    let x = e.clientX - e.currentTarget.getBoundingClientRect().left;
                    let y = e.clientY - e.currentTarget.getBoundingClientRect().top;
                    
                    let ripples = document.createElement('span');
                    ripples.className = 'ripple';
                    ripples.style.left = x + 'px';
                    ripples.style.top = y + 'px';
                    
                    this.appendChild(ripples);
                    
                    setTimeout(() => {
                        ripples.remove();
                    }, 600);
                };
            });
        }

        // Pierwsze wywołanie
        renderConfigs();
    </script>
</body>
</html>
